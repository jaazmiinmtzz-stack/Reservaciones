<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrestaControl Pro | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #cbd5e1; }
        .panel-cobalto { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; }
        input, select { transition: all 0.2s ease; background-color: #111827 !important; border: 1px solid #334155 !important; color: #f1f5f9 !important; }
        .modal { display: none !important; position: fixed; z-index: 100; inset: 0; background: rgba(2, 6, 17, 0.8); backdrop-filter: blur(4px); }
        .modal.flex { display: flex !important; }
        table tbody tr:hover { background-color: #1e293b; }
        .status-finalizado { opacity: 0.4; background-color: #0f172a / 50; }
    </style>
</head>
<body class="text-slate-300">

    <!-- MODAL PRINCIPAL -->
    <div id="mainModal" class="modal items-center justify-center p-4">
        <div class="modal-content bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-700">
            <div class="bg-gray-950 p-6 flex justify-between items-center border-b border-slate-700">
                <div>
                    <p class="text-[10px] text-teal-400 font-bold uppercase tracking-widest mb-1" id="modalUser">Usuario</p>
                    <h3 class="text-lg font-extrabold text-white" id="modalTitle">TÍTULO</h3>
                </div>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-8 max-h-[60vh] overflow-y-auto" id="modalBody"></div>
            <div class="p-6 bg-gray-950 border-t border-slate-700 flex justify-end gap-3">
                <button onclick="cerrarModal()" class="px-5 py-2 text-slate-400 font-bold">Cancelar</button>
                <button id="btnGuardar" class="px-8 py-2.5 bg-teal-600 hover:bg-teal-500 text-slate-950 rounded-xl font-extrabold shadow-md">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="bg-gray-950 px-6 py-4 sticky top-0 z-40 border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏦</span>
                <h1 class="text-lg font-black text-white uppercase tracking-tighter">Presta<span class="text-teal-400">Control</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- NUEVO BOTÓN INTERRUPTOR PARA VER PAGADOS -->
                <button id="togglePagadosBtn" onclick="toggleMostrarPagados()" class="text-[10px] bg-slate-900 hover:bg-slate-800 text-slate-400 px-4 py-2.5 rounded-xl border border-slate-700 font-bold uppercase tracking-wider">
                    👁️ Ver Liquidados
                </button>
                <div id="totalGlobalBox" class="hidden text-right">
                    <p class="text-[9px] text-slate-500 font-black uppercase">Cartera Activa</p>
                    <p id="totalPrestadoValue" class="text-teal-400 font-black text-lg leading-none">$0</p>
                </div>
                <button id="adminBtn" onclick="toggleAdmin()" class="text-[10px] bg-slate-800 text-slate-300 px-5 py-2.5 rounded-xl border border-slate-600 font-bold uppercase">🔒 Acceso Admin</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- FORMULARIO -->
        <div class="panel-cobalto mb-8 overflow-hidden">
            <form id="loanForm" class="p-8 grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Deudor</label>
                    <input type="text" id="debtor" class="w-full p-3.5 rounded-xl text-sm" required>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Monto y %</label>
                    <div class="flex gap-2">
                        <input type="number" id="amount" class="w-full p-3.5 rounded-xl text-sm font-bold" required>
                        <select id="interest" class="p-3.5 rounded-xl text-sm font-black">
                            <option value="5">5%</option>
                            <option value="10" selected>10%</option>
                            <option value="15">15%</option>
                            <option value="20">20%</option>
                        </select>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Fecha Inicio</label>
                    <input type="date" id="startDate" class="w-full p-3.5 rounded-xl text-sm" required>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Vencimiento</label>
                    <input type="date" id="dueDate" class="w-full p-3.5 rounded-xl text-sm" required>
                </div>
                <button type="submit" class="md:col-span-12 bg-gray-950 border border-teal-800 hover:bg-teal-900 text-teal-400 font-black py-4 rounded-2xl transition-all uppercase text-[11px] tracking-widest">Registrar Préstamo</button>
            </form>
        </div>

        <!-- FILTRO Y SUMA DE IMPORTES SELECCIONADOS -->
        <div class="panel-cobalto mb-4 p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="filtroNombre" class="block text-[10px] font-black text-slate-400 uppercase mb-2">Buscar por nombre</label>
                <input type="search" id="filtroNombre" placeholder="Escribe el nombre del deudor..." class="w-full p-3 rounded-xl text-sm">
            </div>
            <div class="bg-gray-950/70 rounded-xl p-3">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Importes seleccionados</p>
                <div class="flex flex-wrap gap-x-5 gap-y-2 text-sm">
                    <span>Capital: <strong id="sumaCapitalSeleccionado" class="text-white">$0</strong></span>
                    <span>Rédito: <strong id="sumaReditoSeleccionado" class="text-teal-400">$0</strong></span>
                    <span>Total a pagar: <strong id="sumaTotalSeleccionado" class="text-amber-400">$0</strong></span>
                </div>
                <button type="button" id="limpiarSeleccion" class="mt-2 text-[10px] text-slate-400 underline">Limpiar selección</button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="panel-cobalto overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-800">
                    <thead class="bg-gray-950">
                        <tr>
                            <th class="px-6 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">Deudor</th>
                            <th class="px-6 py-5 text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">Captura</th>
                            <th class="px-6 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">Capital</th>
                            <th class="px-6 py-5 text-center text-[10px] font-black text-teal-500 uppercase tracking-widest">%</th>
                            <th class="px-6 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">Rédito</th>
                            <th class="px-6 py-5 text-right text-[10px] font-black text-teal-400 uppercase tracking-widest">Atraso</th>
                            <th class="px-6 py-5 text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">Vencimiento</th>
                        </tr>
                    </thead>
                    <tbody id="loanList" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, orderBy, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "prestamos-a35bb.firebaseapp.com",
            projectId: "prestamos-a35bb",
            storageBucket: "prestamos-a35bb.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // La sesión de administrador se conserva al actualizar la página en la misma pestaña.
        let esAdmin = false;
        try { esAdmin = sessionStorage.getItem("prestacontrol_admin") === "1"; } catch (e) {}
        let mostrarPagados = false;
        let lastSnap = null;
        let renderVersion = 0;
        const seleccionCapital = new Set();
        const seleccionRedito = new Set();
        const historialCache = new Map();
        const formatoDinero = (n) => "$" + Number(n || 0).toLocaleString("es-MX");

        function actualizarEstadoAdmin() {
            document.getElementById('adminBtn').innerHTML = esAdmin
                ? '<span class="text-teal-400">●</span> SALIR ADMIN'
                : '🔒 Acceso Admin';
            document.getElementById('totalGlobalBox').classList.toggle('hidden', !esAdmin);
        }

        window.actualizarSeleccion = (tipo, id, marcado) => {
            const conjunto = tipo === 'capital' ? seleccionCapital : seleccionRedito;
            if (marcado) conjunto.add(id); else conjunto.delete(id);
            actualizarSumaSeleccionada();
        };

        function actualizarSumaSeleccionada() {
            let capital = 0, redito = 0;
            if (lastSnap) {
                lastSnap.docs.forEach(d => {
                    const dato = d.data();
                    if (seleccionCapital.has(d.id)) capital += Number(dato.capital || 0);
                    if (seleccionRedito.has(d.id)) redito += Number(dato.redito || 0);
                });
            }
            document.getElementById('sumaCapitalSeleccionado').textContent = formatoDinero(capital);
            document.getElementById('sumaReditoSeleccionado').textContent = formatoDinero(redito);
            document.getElementById('sumaTotalSeleccionado').textContent = formatoDinero(capital + redito);
        }

        document.getElementById('filtroNombre').addEventListener('input', () => {
            if (lastSnap) renderTable(lastSnap);
        });
        document.getElementById('limpiarSeleccion').addEventListener('click', () => {
            seleccionCapital.clear();
            seleccionRedito.clear();
            document.querySelectorAll('input[data-tipo="capital"], input[data-tipo="redito"]').forEach(c => c.checked = false);
            actualizarSumaSeleccionada();
        });
        actualizarEstadoAdmin();

        const fFecha = (f) => f ? new Date(f + "T12:00:00").toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) : "---";

        function mesesTranscurridos(fecha) {
            const inicio = new Date(fecha + "T12:00:00");
            const hoy = new Date();
            let meses = (hoy.getFullYear() - inicio.getFullYear()) * 12;
            meses -= inicio.getMonth();
            meses += hoy.getMonth();
            if (hoy.getDate() < inicio.getDate()) meses--;
            return meses > 0 ? meses : 0;
        }

        window.cerrarModal = () => document.getElementById('mainModal').classList.remove('flex');

        window.toggleAdmin = () => {
            if (!esAdmin) {
                if (prompt("Clave Admin:") === "3010") {
                    esAdmin = true;
                    try { sessionStorage.setItem("prestacontrol_admin", "1"); } catch (e) {}
                }
            } else {
                esAdmin = false;
                try { sessionStorage.removeItem("prestacontrol_admin"); } catch (e) {}
            }
            actualizarEstadoAdmin();
            if (lastSnap) renderTable(lastSnap);
        };

        // Función para activar/desactivar el filtro desde el Navbar
        window.toggleMostrarPagados = () => {
            mostrarPagados = !mostrarPagados;
            const btn = document.getElementById('togglePagadosBtn');
            if (mostrarPagados) {
                btn.innerHTML = `👁️ Ocultar Liquidados`;
                btn.classList.replace('text-slate-400', 'text-teal-400');
                btn.classList.add('border-teal-500');
            } else {
                btn.innerHTML = `👁️ Ver Liquidados`;
                btn.classList.replace('text-teal-400', 'text-slate-400');
                btn.classList.remove('border-teal-500');
            }
            if(lastSnap) renderTable(lastSnap);
        };

        onSnapshot(query(collection(db, "prestamos"), orderBy("timestamp", "desc")), (snap) => {
            lastSnap = snap;
            renderTable(snap);
        }, (error) => {
            console.error("Error al consultar préstamos:", error);
            document.getElementById('loanList').innerHTML =
                '<tr><td colspan="7" class="p-6 text-center text-red-400">No se pudo cargar la información. Verifica tu conexión e intenta nuevamente.</td></tr>';
        });

        async function renderTable(snap) {
            const lista = document.getElementById('loanList');
            const version = ++renderVersion;
            lista.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">Cargando información...</td></tr>';

            // Consultar historiales en paralelo evita esperar uno por uno, especialmente en iPhone.
            const registros = await Promise.all(snap.docs.map(async (docu) => {
                const item = docu.data();
                const id = docu.id;
                let pagado = historialCache.get(id);
                if (pagado === undefined) {
                    const reditosSnap = await getDocs(collection(db, "prestamos", id, "historial_reditos"));
                    pagado = 0;
                    reditosSnap.forEach(r => {
                        const mov = r.data();
                        pagado += Number(mov.valorContable ?? mov.monto ?? 0);
                    });
                    historialCache.set(id, pagado);
                }
                return { id, item, pagado };
            }));

            // Ignora respuestas antiguas si llegó una actualización más reciente.
            if (version !== renderVersion) return;

            lista.innerHTML = "";
            let totalG = 0;
            const filtro = document.getElementById('filtroNombre').value.trim().toLocaleLowerCase('es-MX');

            for (const registro of registros) {
                const { id, item, pagado } = registro;
                const isFinalizado = item.finalizado === true;
                if (!mostrarPagados && isFinalizado) continue;
                if (filtro && !String(item.nombre || '').toLocaleLowerCase('es-MX').includes(filtro)) continue;

                if (!isFinalizado) totalG += Number(item.capital || 0);

                const mesesDebidos = mesesTranscurridos(item.fechaInicio);
                const ajusteAtraso = Number(item.ajusteAtraso || 0);
                const totalQueDebioPagar = (mesesDebidos * Number(item.redito || 0)) + ajusteAtraso;
                const saldoFinal = isFinalizado ? 0 : Math.max(0, totalQueDebioPagar - pagado);

                let botones = '';
                if (esAdmin) {
                    if (!isFinalizado) {
                        botones = `
                        <div class="flex gap-1.5 mt-3 flex-wrap">
                            <button onclick="formPago('${id}', '${item.nombre}', ${item.redito})" class="bg-teal-600 text-slate-950 px-2 py-1 rounded text-[9px] font-bold uppercase">Pagar</button>
                            <button onclick="formAbonoCapital('${id}', '${item.nombre}', ${item.capital}, '${item.fechaInicio}', ${item.tasa}, ${ajusteAtraso})" class="bg-blue-600/20 text-blue-400 border border-blue-800 px-2 py-1 rounded text-[9px] font-bold uppercase">Abonar Cap</button>
                            <button onclick="condonarRedito('${id}', '${item.nombre}', ${item.redito})" class="bg-orange-600/20 text-orange-400 border border-orange-800 px-2 py-1 rounded text-[9px] font-bold uppercase">Condonar</button>
                            <button onclick="verHistorial('${id}', '${item.nombre}')" class="bg-slate-700 text-white px-2 py-1 rounded text-[9px] font-bold uppercase">Historial</button>
                            <button onclick="formEditGral('${id}', '${item.nombre}', ${item.capital}, '${item.fechaInicio}', '${item.vencimiento}', ${item.tasa}, ${ajusteAtraso})" class="bg-slate-700 text-white px-2 py-1 rounded text-[9px] font-bold uppercase">Editar</button>
                            <button onclick="marcarComoPagado('${id}', '${item.nombre}')" class="bg-teal-900/50 text-teal-300 border border-teal-700 px-2 py-1 rounded text-[9px] font-bold uppercase">Liquidar</button>
                            <button onclick="eliminarRegistro('${id}', '${item.nombre}')" class="bg-red-900/40 text-red-400 border border-red-800 px-2 py-1 rounded text-[9px] font-bold uppercase">Borrar</button>
                        </div>`;
                    } else {
                        botones = `
                        <div class="flex gap-1.5 mt-3">
                            <span class="text-[10px] font-bold text-teal-500 uppercase tracking-widest italic">✓ Liquidado</span>
                            <button onclick="verHistorial('${id}', '${item.nombre}')" class="bg-slate-700 text-white px-2 py-1 rounded text-[9px] font-bold uppercase">Historial</button>
                            <button onclick="eliminarRegistro('${id}', '${item.nombre}')" class="bg-red-900/20 text-red-400 px-2 py-1 rounded text-[9px] font-bold uppercase ml-2">Borrar</button>
                        </div>`;
                    }
                }

                lista.innerHTML += `
                    <tr class="border-b border-slate-800 ${isFinalizado ? 'status-finalizado opacity-40 bg-slate-950/40' : ''}">
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-2">
                                <p class="font-bold text-white uppercase text-sm">${item.nombre}</p>
                                ${isFinalizado ? '<span class="bg-teal-500 text-slate-900 text-[8px] px-1.5 py-0.5 rounded-full font-black">PAGADO</span>' : ''}
                            </div>
                            ${botones}
                        </td>
                        <td class="px-6 py-5 text-center text-xs text-slate-400">${fFecha(item.fechaInicio)}</td>
                        <td class="px-6 py-5 text-right font-bold text-slate-100">
                                <label class="inline-flex items-center justify-end gap-2">
                                    <input type="checkbox" class="w-4 h-4 accent-teal-500" data-tipo="capital" data-id="${id}" onchange="actualizarSeleccion('capital','${id}',this.checked)" ${seleccionCapital.has(id) ? 'checked' : ''}>
                                    <span>$${Number(item.capital || 0).toLocaleString('es-MX')}</span>
                                </label>
                            </td>
                        <td class="px-6 py-5 text-center"><span class="text-teal-400 font-black text-[10px]">${item.tasa}%</span></td>
                        <td class="px-6 py-5 text-right text-slate-500 font-bold">
                                <label class="inline-flex items-center justify-end gap-2">
                                    <input type="checkbox" class="w-4 h-4 accent-teal-500" data-tipo="redito" data-id="${id}" onchange="actualizarSeleccion('redito','${id}',this.checked)" ${seleccionRedito.has(id) ? 'checked' : ''}>
                                    <span>$${Number(item.redito || 0).toLocaleString('es-MX')}</span>
                                </label>
                            </td>
                        <td class="px-6 py-5 text-right">
                            <p class="${saldoFinal > 0 ? 'text-red-400' : 'text-teal-500'} font-black text-base">$${saldoFinal.toLocaleString()}</p>
                        </td>
                        <td class="px-6 py-5 text-center text-xs text-slate-500 font-medium">${fFecha(item.vencimiento)}</td>
                    </tr>`;
            }
            document.getElementById('totalPrestadoValue').innerText = formatoDinero(totalG);
            actualizarSumaSeleccionada();
        }

        // --- FUNCIONES DE BASE DE DATOS ---
        window.marcarComoPagado = async (id, nombre) => {
            if(confirm(`¿Confirmas liquidación total de ${nombre}?`)) {
                await updateDoc(doc(db, "prestamos", id), { finalizado: true });
            }
        };

        window.formAbonoCapital = (id, nombre, capitalActual, fechaInicio, tasa, ajusteActual) => {
            document.getElementById('modalTitle').innerText = "Abono a Capital";
            document.getElementById('modalUser').innerText = nombre;
            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-4">
                    <p class="text-xs text-slate-400">Capital actual: <strong class="text-white">$${capitalActual.toLocaleString()}</strong></p>
                    <label class="block text-[10px] font-black text-slate-400 uppercase">Monto a abonar al capital</label>
                    <input type="number" id="montoAbono" placeholder="0" class="w-full p-4 rounded-xl bg-gray-950 text-teal-400 font-bold text-xl">
                    <label class="block text-[10px] font-black text-slate-400 uppercase">Fecha del Abono</label>
                    <input type="date" id="fAbono" value="${new Date().toISOString().split('T')[0]}" class="w-full p-4 rounded-xl bg-gray-950 text-white">
                </div>`;
                
            document.getElementById('btnGuardar').onclick = async () => {
                const abono = Number(document.getElementById('montoAbono').value);
                if (abono <= 0) return alert("Ingresa un monto válido");
                if (abono > capitalActual) return alert("El abono no puede superar el capital actual");

                const nuevoCapital = capitalActual - abono;
                const mesesPasados = mesesTranscurridos(fechaInicio);
                const reditoViejo = capitalActual * (tasa / 100);
                const reditoNuevo = nuevoCapital * (tasa / 100);

                const diferenciaReditoTotal = (reditoViejo - reditoNuevo) * mesesPasados;
                const nuevoAjusteAtraso = (ajusteActual || 0) + diferenciaReditoTotal;
                const fechaAbono = document.getElementById('fAbono').value;

                await updateDoc(doc(db, "prestamos", id), {
                    capital: nuevoCapital,
                    redito: reditoNuevo,
                    ajusteAtraso: nuevoAjusteAtraso
                });

                await addDoc(collection(db, "prestamos", id, "historial_reditos"), {
                    monto: abono,
                    valorContable: 0,
                    nota: `Abono a Capital ($${abono.toLocaleString()})`,
                    fecha: fechaAbono,
                    timestamp: new Date()
                });
                historialCache.delete(id);

                cerrarModal();
            };
            document.getElementById('btnGuardar').style.display = 'block';
            document.getElementById('mainModal').classList.add('flex');
        };

        window.formEditGral = (id, nombre, capital, fechaIni, fechaVen, tasa, ajusteActual) => {
            document.getElementById('modalTitle').innerText = "Editar Préstamo";
            document.getElementById('modalUser').innerText = nombre;
            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase">Monto Capital</label>
                    <input type="number" id="editCap" value="${capital}" class="w-full p-4 rounded-xl bg-gray-950 text-teal-400 font-bold text-xl" placeholder="Capital">
                    <label class="block text-[10px] font-black text-slate-400 uppercase">Fecha de Inicio original</label>
                    <input type="date" id="editFechaIni" value="${fechaIni}" class="w-full p-4 rounded-xl bg-gray-950 text-white">
                    <label class="block text-[10px] font-black text-slate-400 uppercase">Fecha de Vencimiento</label>
                    <input type="date" id="editFechaVen" value="${fechaVen || ''}" class="w-full p-4 rounded-xl bg-gray-950 text-white">
                </div>`;
                
            document.getElementById('btnGuardar').onclick = async () => {
                const nCap = Number(document.getElementById('editCap').value);
                const fechaInicioForm = document.getElementById('editFechaIni').value;
                
                const mesesPasados = mesesTranscurridos(fechaInicioForm);
                const reditoViejo = capital * (tasa / 100);
                const reditoNuevo = nCap * (tasa / 100);
                
                const diferenciaReditoTotal = (reditoViejo - reditoNuevo) * mesesPasados;
                const nuevoAjusteAtraso = (ajusteActual || 0) + diferenciaReditoTotal;

                await updateDoc(doc(db, "prestamos", id), { 
                    capital: nCap, 
                    fechaInicio: fechaInicioForm,
                    vencimiento: document.getElementById('editFechaVen').value, 
                    redito: reditoNuevo,
                    ajusteAtraso: nuevoAjusteAtraso
                });
                cerrarModal();
            };
            document.getElementById('btnGuardar').style.display = 'block';
            document.getElementById('mainModal').classList.add('flex');
        };

        window.formPago = (id, nombre, redito) => {
            document.getElementById('modalTitle').innerText = "Registrar Pago";
            document.getElementById('modalUser').innerText = nombre;
            document.getElementById('modalBody').innerHTML = `
                <input type="number" id="mRedito" value="${redito}" class="w-full p-4 rounded-xl bg-gray-950 text-teal-400 font-bold text-xl mb-4">
                <input type="date" id="fRedito" value="${new Date().toISOString().split('T')[0]}" class="w-full p-4 rounded-xl bg-gray-950 text-white">
            `;
            document.getElementById('btnGuardar').onclick = async () => {
                await addDoc(collection(db, "prestamos", id, "historial_reditos"), { 
                    monto: Number(document.getElementById('mRedito').value), 
                    valorContable: Number(document.getElementById('mRedito').value), 
                    fecha: document.getElementById('fRedito').value, timestamp: new Date() 
                });
                historialCache.delete(id);
                cerrarModal();
            };
            document.getElementById('btnGuardar').style.display = 'block';
            document.getElementById('mainModal').classList.add('flex');
        };

        window.condonarRedito = (id, nombre, redito) => {
            if(confirm(`¿Condonar un mes ($${redito}) a ${nombre}?`)) {
                addDoc(collection(db, "prestamos", id, "historial_reditos"), { 
                    monto: 0, valorContable: redito, nota: "Condonado", 
                    fecha: new Date().toISOString().split('T')[0], timestamp: new Date() 
                }).then(() => historialCache.delete(id));
            }
        };

        window.verHistorial = async (id, nombre) => {
            const snap = await getDocs(query(collection(db, "prestamos", id, "historial_reditos"), orderBy("timestamp", "desc")));
            let html = '';
            let sumaPagos = 0;
            snap.forEach(d => {
                const p = d.data();
                sumaPagos += Number(p.monto || 0);
                html += `<div class="p-3 bg-gray-950 border border-slate-800 rounded-lg mb-2 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-slate-500">${fFecha(p.fecha)} ${p.nota ? `<span class="text-blue-400 font-semibold">(${p.nota})</span>` : ''}</p>
                        <p class="font-bold text-teal-400">$${Number(p.monto || 0).toLocaleString('es-MX')}</p>
                    </div>
                    <button onclick="borrarHistorialItem('${id}','${d.id}')" class="text-red-500 text-xs uppercase font-bold">Borrar</button>
                </div>`;
            });
            const totalHtml = `<div class="p-4 mb-3 bg-teal-950/40 border border-teal-800 rounded-lg flex justify-between items-center">
                <span class="text-xs font-black text-slate-300 uppercase">Suma de pagos</span>
                <span class="text-lg font-black text-teal-400">${formatoDinero(sumaPagos)}</span>
            </div>`;
            document.getElementById('modalTitle').innerText = "Historial de Pagos";
            document.getElementById('modalUser').innerText = nombre;
            document.getElementById('modalBody').innerHTML = (html ? totalHtml + html : '<p class="text-center text-slate-500">Sin movimientos</p>');
            document.getElementById('btnGuardar').style.display = 'none';
            document.getElementById('mainModal').classList.add('flex');
        };

        window.borrarHistorialItem = async (pid, rid) => { 
            if(confirm("¿Borrar este pago?")) { await deleteDoc(doc(db, "prestamos", pid, "historial_reditos", rid)); historialCache.delete(pid); cerrarModal(); } 
        };

        window.eliminarRegistro = async (id, nombre) => { 
            if(confirm(`¿ELIMINAR TODO EL REGISTRO DE ${nombre}?`)) await deleteDoc(doc(db, "prestamos", id)); 
        };

        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cap = Number(document.getElementById('amount').value);
            const tasa = Number(document.getElementById('interest').value);
            await addDoc(collection(db, "prestamos"), {
                nombre: document.getElementById('debtor').value, capital: cap, tasa: tasa, redito: cap * (tasa / 100),
                fechaInicio: document.getElementById('startDate').value, vencimiento: document.getElementById('dueDate').value, 
                timestamp: new Date(), finalizado: false, ajusteAtraso: 0
            });
            e.target.reset();
        });

    </script>
</body>
</html>
